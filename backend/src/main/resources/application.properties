spring.application.name=Train Assistant

spring.config.import=optional:file:../.env[.properties]
server.address=127.0.0.1


pkp.api-key=${PKP_API_KEY:}
pkp.base-url=https://pdp-api.plk-sa.pl
pkp.connect-timeout=5s
pkp.read-timeout=20s


spring.ssl.bundle.pem.pkp.truststore.certificate=classpath:certs/certum-trusted-root-ca.pem

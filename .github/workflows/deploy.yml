name: Test and deploy Train Assistant

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: train-assistant-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.sha }}
      TRAIN_ENV_FILE: /tmp/train-assistant-ci.env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image and run frontend and backend tests
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: docker build -t "train-assistant:$RELEASE_SHA" .
      - name: Verify production container before deployment
        id: smoke
        run: |
          touch "$TRAIN_ENV_FILE"
          docker compose -p train-assistant-ci -f compose.prod.yml up -d --wait --wait-timeout 180
          curl -fsS --max-time 10 http://127.0.0.1:18080/healthz
          curl -fsS --max-time 10 http://127.0.0.1:18080/ -o "$RUNNER_TEMP/train-index.html"
          grep -q 'Train Assistant' "$RUNNER_TEMP/train-index.html"
      - name: Remove test container
        if: always() && steps.smoke.outcome != 'skipped'
        run: docker compose -p train-assistant-ci -f compose.prod.yml down
      - name: Package image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p release
          docker save "train-assistant:$RELEASE_SHA" | gzip > release/image.tar.gz
          cp compose.prod.yml ops/deploy.sh release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: release
          path: release/
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Upload release and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          target="$VPS_USER@$VPS_HOST"
          tar -czf - -C release image.tar.gz compose.prod.yml deploy.sh |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" \
              "umask 077; mkdir -p ~/train-assistant/releases/$RELEASE_SHA && tar -xzf - -C ~/train-assistant/releases/$RELEASE_SHA"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" \
            "bash ~/train-assistant/releases/$RELEASE_SHA/deploy.sh '$RELEASE_SHA'"
      - name: Check public HTTPS
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          [[ "$PUBLIC_URL" == https://* ]]
          curl -fsS --retry 5 --retry-delay 5 --max-time 20 "${PUBLIC_URL%/}/healthz"
